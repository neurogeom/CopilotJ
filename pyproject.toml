[project]
name = "CopilotJ"
version = "1.1.0"
description = "Chat ImageJ with LLM"
readme = "README.md"
authors = [
  { name = "Zexin Yuan", email = "pypi@yzx9.xyz" },
  { name = "Jack Lu", email = "00jacklu@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "appose>=0.5.1",
  "aiohttp[speedups]>=3.14.1",
  "aiohttp-cors>=0.8.1",
  "ujson>=5.13.0",
  "pydantic>=2.10.6",
  "python-dotenv>=1.0.1",
  "openai>=1.63.2",
  "anthropic>=0.52.0",
  "google-genai>=1.0.0",
  "jsonref>=1.1.0",
  # console
  "click>=8.1.8",
  "rich>=13.9.4",
  "textual-image>=0.7.0",
  # pyimagej
  "pyimagej>=1.5.0",
  "ipython>=8.31.0",
  "ipykernel>=6.29.5",
  "jupyter-client>=8.6.3",
  # rag
  "wikipedia>=1.4.0",
  "selenium>=4.27.1",
  "beautifulsoup4>=4.12.3",
  "faiss-cpu>=1.14.2",
  "langchain-community>=0.4.2",
  "langchain-huggingface>=1.2.2",
  "langchain-text-splitters>=1.1.2",
  "pymupdf>=1.27.2.3",
  "sentence-transformers>=5.5.1",
  "unstructured>=0.21.5",
  # tools
  "scikit-image>=0.25.2",
  "biapy>=3.5.6",
  "matplotlib>=3.10.3",
  "cellpose==4.2.1.1",
  "torch>=2.7.1",
  "csbdeep>=0.8.1",
  "xarray==2024.11.0",
  "stardist>=0.9.1",
  "timm>=1.0.14",
  "tensorflow>=2.18.1",
  "torchmetrics>=1.7.3",
  "pytorch-msssim>=1.0.0",
  "langchain-core>=1.4.0",
  "napari-process-points-and-surfaces>=0.5.0",
  "opencv-python>=4.11.0.86",
  "opencv-contrib-python>=4.11.0.86",
  "pyclesperanto-prototype>=0.24.5",
  "trackpy>=0.6.4",
  "tavily-python>=0.7.10",
  "seaborn>=0.13.2",
  "plotly>=5.24.1",
  "kaleido>=1.0.0",
  "altair>=5.5.0",
  "holoviews>=1.21.0",
  "bokeh>=3.7.3",
  "pygal>=3.0.5",
  "plotly-resampler>=0.10.0",
  "langfuse>=4.0.0",
  "opentelemetry-instrumentation-anthropic>=0.40.0",
  "openinference-instrumentation-google-genai>=0.1.0",
  "imageio>=2.37.0",
  "tifffile>=2025.1.10",
  "pystackreg>=0.2.8",
  "suite2p>=0.14.5",
  "ddgs>=9.10.0",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-cov>=6.0.0", "ruff>=0.11.4"]

[tool.pytest.ini_options]
addopts = "-p no:napari"
filterwarnings = ["ignore:.*Jupyter is migrating.*:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["copilotj"]
extend-exclude = [".agents"]
format.docstring-code-format = true
lint.pydocstyle.convention = "google"
