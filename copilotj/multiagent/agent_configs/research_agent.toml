name = "Research Agent"
description = "Hybrid agent that combines web search capabilities with local knowledge base retrieval for comprehensive research."
class = "copilotj.multiagent.Executor.Executor"
prompt = """
You are the **Research Agent**, a fast, well-cited research specialist in a multiagent system. Answer accurately with the fewest necessary tool calls.

## Research Policy
- Choose tools by query type: local ImageJ knowledge for established workflows, Image.sc for community troubleshooting, BioImage Model Zoo for models, Wikipedia for background, and web search for current or broad information.
- Use 1-3 targeted tool calls for simple/moderate questions. Use deep research only when explicitly requested or when the task truly needs multi-source, cross-validated coverage.
- Synthesize sources instead of listing search results. Cite claims inline as [1], [2], and include references.
- When the topic is visual (microscopy examples, algorithms, tutorials, data plots, biological samples, or workflows), search for relevant figures or diagrams. Use `images=true` when appropriate.
- Download resources only when useful and permitted by the user; list saved local paths and why they matter.
- Create tables for comparisons, parameters, model/tool choices, or structured findings.

## Execution Format
- Thought: briefly state complexity, chosen source/tool, and expected outcome.
- Action: output EXACTLY ONE tool call in this JSON form:
Action: {"name": "<tool_name>", "args": { ... }}
- After each observation, continue with one next Action or finish.
- If complete, output:
Final Answer: a structured markdown answer with title, short executive summary, main findings, practical guidance when relevant, tables/figures when useful, references, downloaded resources if any, and a concise conclusion.
"""

[[tools]]
factory = "copilotj.multiagent.research_tools.make_tavily_search"
description = """
Current web search with Tavily AI. Primary choice for recent, broad, or well-sourced
web information, including breaking updates and public image-source discovery.
"""

[[tools]]
display_name = "ImageJ Knowledge Base"
function = "copilotj.multiagent.research_tools.imagej_retriever"
description = """
Search the local ImageJ knowledge base. Use for established ImageJ/Fiji workflows,
macro syntax, image-processing algorithms, curated docs, and expert-validated local knowledge.
"""

[[tools]]
display_name = "DuckDuckGo Search"
function = "copilotj.multiagent.research_tools.ddg_search"
description = """
DuckDuckGo web/image search. Set `images=true` for direct image links and previews,
`public_only=true` to bias Wikimedia/Flickr/Unsplash, and `safesearch` to off/moderate/strict.
"""

[[tools]]
function = "copilotj.multiagent.research_tools.wikipedia_search"
description = """
Wikipedia search for structured background, definitions, established facts, history,
and broad topic overviews. Use for context, not for the newest information.
"""

[[tools]]
display_name = "Image.sc Forum Search"
function = "copilotj.multiagent.research_tools.imagesc_search"
description = """
Search Image.sc forum discussions for ImageJ/image-analysis troubleshooting, plugin workflows,
community best practices, and expert practical advice. Uses direct crawl with 15s timeout and
Tavily fallback on crawl failure/timeout.
"""

[[tools]]
factory = "copilotj.multiagent.research_tools.make_deep_research"
description = """
Comprehensive multi-source research report. Uses up to 8 sources: local ImageJ KB,
Tavily, Image.sc, bio-image.io, Wikipedia, DuckDuckGo, technical implementation search,
and targeted follow-up searches.

Use only when the user explicitly asks for "Deep Research" or the question truly requires
systematic cross-validation across many sources. This is resource-intensive.
"""

[[tools]]
function = "copilotj.multiagent.research_tools.download_resource"
description = """
Run custom Python download code for trusted images, PDFs, datasets, papers, docs, or files
that need local processing. Saves to project temp/downloads/ and returns script output plus
target directory. Get user permission before downloading.
"""

[[tools]]
display_name = "BioImage Model Zoo Search"
factory = "copilotj.multiagent.research_tools.make_bioimage_search_models"
description = """
Search BioImage Model Zoo for pretrained image-analysis models. Returns model name, ID,
version, description, and tags.

Parameters: `query` searches names/descriptions/tags; `tags` filters e.g. `["denoising", "2D"]`;
`authors` filters by author; `limit` defaults to 10. Use for denoising, segmentation,
detection, 2D/3D models, or author-specific model discovery.
"""

[[tools]]
display_name = "BioImage Model Info"
function = "copilotj.multiagent.research_tools.bioimage_get_model_info"
description = """
Get detailed BioImage Model Zoo metadata for one model: description, authors, tags,
version, capabilities, requirements, and download URLs. Parameter: `model_id` from search results.
"""

[[tools]]
display_name = "BioImage Model Download"
factory = "copilotj.multiagent.research_tools.make_bioimage_download_model"
description = """
Download a BioImage Model Zoo model archive locally for offline use or ImageJ/Fiji deployment.
Parameters: `model_id`; optional `dest_dir` defaults to temp/bioimage_models. Downloads may be large.
"""
