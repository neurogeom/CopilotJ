# Upscale and enhance images using deep learning SR models (e.g., ESPCN, EDSR, RCAN, SRGAN/Real-ESRGAN, SwinIR). Supports 2×–4× (and higher when model allows), with tiling for large images.

# **Tags**: image_enhancement, super_resolution

# **Tips**:
# - Choose model by need:
#   - **EDSR/RCAN/SwinIR** → high-fidelity restoration; good for scientific images.
#   - **ESPCN** → lightweight, real-time 2× SR.
#   - **Real-ESRGAN/SRGAN** → perceptual quality; may hallucinate details—avoid for measurements.
# - Scale & metadata:
#   - Match requested **scale factor** (2×/3×/4×) to downstream analysis; update pixel size metadata after SR.
#   - Avoid chaining upscales (e.g., 2× then 2×); prefer a single native 4× model.
# - Pre/post-processing:
#   - **Denoise** or correct illumination first; heavy noise degrades SR.
#   - For microscopy, consider mild **deconvolution before SR** to respect optical PSF.
#   - After SR, use subtle sharpening only if needed—don't double-sharpen.
# - Scientific caution:
#   - SR can create **hallucinated structures**. Use for **visualization** unless validated against ground truth.
#   - For quantification, validate on a **calibration phantom** or simulated down/up pairs.
# - Color & channels:
#   - Prefer **luminance-only SR** for natural images; for microscopy, process **per-channel** consistently.
#   - Keep dtype/range consistent; clamp outputs to valid ranges.
# - Large images:
#   - Enable **tiling/overlap** to avoid seams; keep enough overlap to hide borders.
#   - Use GPU if available; for CPU paths, reduce tile size to manage memory.
# - Robustness:
#   - If input is JPEG/compressed, consider **deblocking** or use models trained for degradations (Real-ESRGAN).
#   - Downscale a small **ROI** and A/B test vs **bicubic** baseline to confirm real gains.
# - Reproducibility:
#   - Log **model name/version, scale, tile size, overlap, seed** (for GAN variants), and pre/post steps.
# """

