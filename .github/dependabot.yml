version: 2
updates:
  # Java plugin (Fiji/ImageJ) — explicitly configured; auto-detection missed it
  # because the pom lives in /plugin and extends the pom-scijava parent.
  - package-ecosystem: "maven"
    directory: "/plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Python backend (uv) — uses uv.lock at the repo root.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Vue frontend (pnpm).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # pnpm 11 enforces minimumReleaseAge = 1 day by default, so any lockfile
    # entry published within the last day fails `pnpm install` in CI with
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. Hold Dependabot back for 2 days
    # (1-day margin over pnpm's window) so its PRs never propose a version the
    # supply-chain policy will reject. Security updates bypass cooldown by design.
    cooldown:
      default-days: 2
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions workflows (.github/workflows/*.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker — root Dockerfile (Python + CUDA base images).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Docker — web/Dockerfile (node + nginx base images).
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
