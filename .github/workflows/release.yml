name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.0.2)
        required: true
        type: string

permissions:
  contents: write

env:
  WEB_IMAGE_NAME: copilotj-web

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

  # ── Build: call reusable workflow ──

  build:
    needs: prepare
    uses: ./.github/workflows/_build-jars.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  # ── Release: download artifacts + Docker + publish ──

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Docker ──

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          load: true
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image

      - name: Export Web image
        run: |
          docker save ${{ env.WEB_IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            | gzip > ${{ env.WEB_IMAGE_NAME }}-${{ needs.prepare.outputs.version }}.tar.gz

      # ── Download JARs ──

      - name: Download JAR artifacts
        uses: actions/download-artifact@v8
        with:
          name: copilotj-jars
          path: jars/

      - name: Stage release files
        run: |
          mv jars/CopilotJBridge-${{ needs.prepare.outputs.version }}.jar \
            CopilotJBridge-${{ needs.prepare.outputs.version }}.jar

      # ── Publish ──

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            CopilotJBridge-${{ needs.prepare.outputs.version }}.jar
            ${{ env.WEB_IMAGE_NAME }}-${{ needs.prepare.outputs.version }}.tar.gz
